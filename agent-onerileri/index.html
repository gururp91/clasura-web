<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Agent Önerileri</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF0F4;
  --ink:#141920; --ink-2:#4C5766; --ink-3:#77828F;
  --line:#DDE2E9; --line-strong:#C6CDD7;
  --kasa:#9C6B12; --kasa-bg:#FBF2DF; --kasa-line:#E3C67E;
  --dus:#0F6B57; --dus-bg:#E4F1ED;
  --yuk:#9B3C46; --yuk-bg:#F7E7E8;
  --iyi:#0F6B57; --uyari:#9C6B12; --kritik:#9B3C46;
  --bar:#8894A4;
  --shadow:0 1px 2px rgba(20,25,32,.06), 0 6px 16px -10px rgba(20,25,32,.18);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101318; --surface:#171B21; --surface-2:#1E232B;
    --ink:#E9ECF1; --ink-2:#A7B0BC; --ink-3:#79838F;
    --line:#252B34; --line-strong:#333B46;
    --kasa:#E3AC4A; --kasa-bg:#2A2314; --kasa-line:#6B5423;
    --dus:#4FBFA0; --dus-bg:#14261F;
    --yuk:#DE8A93; --yuk-bg:#2A181A;
    --iyi:#4FBFA0; --uyari:#E3AC4A; --kritik:#DE8A93;
    --bar:#4A5563;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#101318; --surface:#171B21; --surface-2:#1E232B;
  --ink:#E9ECF1; --ink-2:#A7B0BC; --ink-3:#79838F;
  --line:#252B34; --line-strong:#333B46;
  --kasa:#E3AC4A; --kasa-bg:#2A2314; --kasa-line:#6B5423;
  --dus:#4FBFA0; --dus-bg:#14261F;
  --yuk:#DE8A93; --yuk-bg:#2A181A;
  --iyi:#4FBFA0; --uyari:#E3AC4A; --kritik:#DE8A93;
  --bar:#4A5563;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:0 14px 72px}

/* ---- ust bar ---- */
.top{position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--line);margin:0 -14px;padding:12px 14px 10px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0}
.top .tarih{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}

/* ---- bolum basliklari ---- */
h2{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);
  margin:34px 0 3px;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2 .sub{font-family:var(--body);font-size:12.5px;font-weight:400;letter-spacing:0;
  text-transform:none;color:var(--ink-3)}
.rule{height:1px;background:var(--line-strong);margin-bottom:14px}

/* ---- oneri karti ---- */
.kart{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.kartlar{display:flex;flex-direction:column;gap:10px}
.kart-ust{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mac{font-family:var(--disp);font-weight:600;font-size:16.5px;letter-spacing:-.01em;line-height:1.25}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:2px;
  display:flex;gap:8px;flex-wrap:wrap}
.oran-kutu{text-align:right;flex-shrink:0}
.oran{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:-.02em}
.secim{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--ink-2);margin-top:3px}
.rozetler{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rozet{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;padding:2.5px 7px;border-radius:2px;
  border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface-2)}
.rozet.karar-oyna{background:var(--kasa-bg);border-color:var(--kasa-line);color:var(--kasa)}
.rozet.karar-dikkat{background:transparent;border-color:var(--line-strong);color:var(--ink-2)}
.rozet.kagit{color:var(--ink-3)}
.rozet.puan{background:var(--dus-bg);border-color:var(--dus);color:var(--dus)}
.puanlar{display:flex;gap:16px;font-family:var(--mono);font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.puanlar b{color:var(--ink);font-weight:600}
.gerekce{font-size:14.5px;color:var(--ink-2);margin:0}
.zayif{font-size:14px;color:var(--ink-2);margin:0;padding-left:11px;
  border-left:2px solid var(--kritik)}
.zayif b{font-family:var(--disp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--kritik);display:block;margin-bottom:2px;font-weight:700}

.ters{font-size:13.5px;color:var(--ink-3);margin:0;padding-left:11px;border-left:2px solid var(--line-strong)}
.ters b{font-family:var(--disp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:2px;font-weight:700}
.karne-alt.siniflar{color:var(--ink-2)}
.bos{font-size:13.5px;color:var(--ink-3);font-style:italic;padding:9px 2px}
.sozluk{margin:6px 0 2px;font-size:13px;color:var(--ink-3)}
.sozluk summary{cursor:pointer;font-family:var(--disp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 2px}
.sozluk ul{margin:4px 0 0;padding-left:16px;line-height:1.5}
.sozluk b{color:var(--ink-2);font-weight:600}
.uyari-sat{font-size:13.5px;color:var(--ink-2);padding:7px 11px;background:var(--surface-2);
  border-radius:3px;border-left:2px solid var(--uyari)}
.uyarilar{display:flex;flex-direction:column;gap:7px;margin-top:10px}

/* ---- hareket ---- */
.hareket-ozet{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;
  background:var(--surface);overflow:hidden;margin-bottom:14px}
.hareket-ozet div{flex:1;padding:10px 8px;text-align:center;border-right:1px solid var(--line)}
.hareket-ozet div:last-child{border-right:0}
.hareket-ozet .v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.hareket-ozet .k{font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;
  font-family:var(--disp);font-weight:600}
.tablo-sar{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:8px 9px;border-bottom:1px solid var(--line-strong);
  white-space:nowrap;background:var(--surface-2)}
td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;
  font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-size:12.5px}
td.num.d{color:var(--dus);font-weight:600} td.num.y{color:var(--yuk);font-weight:600}
td.mc{white-space:normal;min-width:150px;font-weight:600}
.pct{font-family:var(--mono);font-weight:600}
.pct.d{color:var(--dus)}
.pct.y{color:var(--yuk)}
.tbl-baslik{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;margin:16px 0 7px;display:flex;align-items:center;gap:7px}
.tbl-baslik .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.tbl-baslik.d .dot{background:var(--dus)} .tbl-baslik.d{color:var(--dus)}
.tbl-baslik.y .dot{background:var(--yuk)} .tbl-baslik.y{color:var(--yuk)}

.net{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:14px;margin-top:16px;display:flex;flex-direction:column;gap:11px}
.net-sat b{font-family:var(--disp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:2px;font-weight:700}
.net-sat p{margin:0;font-size:14.5px;color:var(--ink-2)}
.net-sat.vurgu b{color:var(--kasa)}
.net-sat.vurgu p{color:var(--ink);font-weight:600}
.olcum{font-size:13px;color:var(--ink-3);font-style:italic;margin-top:11px;
  padding-left:11px;border-left:2px solid var(--line-strong)}

/* ---- karne ---- */
.karne{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:3px;overflow:hidden}
.karne-sat{background:var(--surface);padding:10px 13px;display:grid;
  grid-template-columns:1fr auto;gap:3px 12px;align-items:center}
.karne-ad{font-family:var(--disp);font-weight:600;font-size:14.5px}
.karne-sag{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}
.karne-sag .isabet{font-size:16px;font-weight:600}
.karne-bar{grid-column:1/-1;height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.karne-bar i{display:block;height:100%;background:var(--bar)}
.karne-bar i.iyi{background:var(--iyi)}
.karne-alt{font-family:var(--mono);font-size:11px;color:var(--ink-3);grid-column:1/-1}

@media (prefers-reduced-motion: no-preference){
  .kart,.karne-sat{transition:border-color .15s ease}
}

</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Agent Önerileri</h1>
    <div class="tarih" id="ust-tarih"></div>
  </div>
  <div id="icerik"></div>

</div>

<script type="application/json" id="rapor-data">{}</script>
<script>
/* Üretimde burası bir URL olur; null iken sayfa gömülü veriyi kullanır. */
const KAYNAK = "kasa.json";   // gömülü veri

const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;
  if(x!==undefined&&x!==null)e.textContent=x;return e;};
/* 🔴 oran BOS gelebilir (Meşin Yuvarlak fiyat bilmez ve bazi turlarda null yaziliyor).
   nf(null) once .toFixed'de patliyor ve TUM sayfa "Rapor yuklenemedi" oluyordu — 8 Eyl 2026'da
   render testi yakaladi. Tek bir eksik alan butun raporu karartmamali. */
const nf=n=>(n===null||n===undefined||isNaN(n))?"—":n.toFixed(2);
const pf=n=>(n>0?"+":"")+n.toFixed(1).replace(".",",")+"%";

function kararSinif(k){return k==="oyna"||k==="kesin oyna"?"karar-oyna":"karar-dikkat";}

function kart(b,kasaMi){
  const k=E("div","kart"+(kasaMi?" kasa":""));
  const ust=E("div","kart-ust");
  const sol=E("div");
  sol.appendChild(E("div","mac",b.mac));
  const m=E("div","meta");
  [b.lig,b.kickoff_trt,b.market].forEach(t=>m.appendChild(E("span",null,t)));
  sol.appendChild(m);
  const sag=E("div","oran-kutu");
  sag.appendChild(E("div","oran",nf(b.oran)));
  sag.appendChild(E("div","secim",b.kisa||b.secim));
  ust.append(sol,sag); k.appendChild(ust);

  const r=E("div","rozetler");
  r.appendChild(E("span","rozet",b.sinif));
  if(b.puan!=null) r.appendChild(E("span","rozet puan",
    "düşen +"+b.puan.toFixed(1).replace(".",",")+"p · "+b.band));
  r.appendChild(E("span","rozet "+kararSinif(b.karar),b.karar));
  if(b.tur==="oyuncu") r.appendChild(E("span","rozet","oyuncu"));
  k.appendChild(r);

  k.appendChild(E("p","gerekce",b.gerekce));
  if(b.zayif_yani){const z=E("p","zayif");z.appendChild(E("b",null,"Zayıf yanı"));
    z.append(b.zayif_yani);k.appendChild(z);}
  /* Sut kalitesi (xGOT) — yalniz Mesin Yuvarlak takim onerisi, n>=3 (Engin karari, 13 Eyl 2026) */
  if(b.xgot){const x=E("p","ters");x.appendChild(E("b",null,"Şut kalitesi"));
    x.append(b.xgot);k.appendChild(x);}
  /* Iki bacak ayni macta TERS yondeyse tek cumle (Engin karari, 12 Eyl 2026) */
  if(b.ters_bacak){const t=E("p","ters");t.appendChild(E("b",null,"Diğer bacak"));
    t.append(b.ters_bacak);k.appendChild(t);}
  return k;
}

function baslik(kok,metin,alt){
  const h=E("h2",null,metin);
  if(alt)h.appendChild(E("span","sub",alt));
  kok.appendChild(h); kok.appendChild(E("div","rule"));
}

function bosNot(t){return E("div","bos",t);}

function ciz(d){
  document.getElementById("ust-tarih").textContent=
    new Date(d.tarih+"T00:00:00").toLocaleDateString("tr-TR",
      {day:"numeric",month:"long",year:"numeric"});
  const c=document.getElementById("icerik");

  /* --- bacaklar --- */
  d.bacaklar.forEach(bc=>{
    const ALT={futbol:"Sadece Futbol",hareket:"Para Hareketi"};
    baslik(c,bc.ad,ALT[bc.kod]);
    const g=E("div","kartlar");
    bc.oneriler.forEach(b=>g.appendChild(kart(b,false)));
    c.appendChild(g);
    if(bc.bos_siniflar.length)
      c.appendChild(bosNot(bc.bos_siniflar.join(" ve ")+
        " sınıfında savunulabilir aday yok — boş bırakıldı."));
    if(bc.kod==="futbol" && bc.oyuncu_notu) c.appendChild(bosNot("Oyuncu bahsi: "+bc.oyuncu_notu));
    if(bc.kod==="futbol"){
      /* Gosterge sozlugu — SABIT metin, JSON'dan gelmez (Engin, 13 Eyl 2026) */
      const SOZ=[
        ["Tempo","DataGaffer'ın maç hızı puanı: iki takımın atak, şut ve pozisyon üretimi. Yüksek tempo, çok gollü maç demek."],
        ["Şut kalitesi (xGOT)","Kaleyi bulan şutların gol değeri. DataGaffer'a göre golün en güçlü göstergesi; toplamı yüksek maçlar çok gollü bitiyor."],
        ["Gol beklentisi (xG)","Pozisyonların kalitesinden hesaplanan beklenen gol sayısı; şutun kaleyi bulup bulmadığına bakmaz."],
        ["Net pozisyon","Gole çok yakın, büyük pozisyon sayısı (DataGaffer 'big chance')."],
        ["İsabetli şut","Kaleyi bulan şut. Bir maçta toplamı yüksekse gol de yüksek geliyor."],
        ["Ev sahası gücü","Takımın kendi sahasında ve deplasmanda ne kadar farklı oynadığı (DataGaffer venue puanı)."],
      ];
      const dt=E("details","sozluk");dt.appendChild(E("summary",null,"Göstergeler ne demek?"));
      const ul=E("ul");SOZ.forEach(([k,v])=>{const li=E("li");li.appendChild(E("b",null,k+": "));li.append(v);ul.appendChild(li);});
      dt.appendChild(ul);c.appendChild(dt);
    }

    if(bc.kod==="hareket"){
      /* --- ORANI DUSENLER / YUKSELENLER (Engin 7 Eyl 2026: geri kondu) --- */
      const HT=d.hareket_tablo;
      if(HT && (HT.dusenler.length || HT.yukselenler.length)){
        [["ORANI DÜŞENLER","d",HT.dusenler],
         ["ORANI YÜKSELENLER","y",HT.yukselenler]].forEach(([ad,cls,L])=>{
          if(!L.length) return;
          const hb=E("div","tbl-baslik "+cls);
          hb.appendChild(E("span","dot"));
          hb.appendChild(E("span",null," "+ad));
          c.appendChild(hb);
          const s2=E("div","tablo-sar"),t2=E("table");
          const h2=E("thead"),r2=E("tr");
          ["Maç","Saat","Seçim","Açılış → Şimdi","%","Gün zirvesi","Sınıf","Durum"]
            .forEach(x=>r2.appendChild(E("th",null,x)));
          h2.appendChild(r2);t2.appendChild(h2);
          const b2=E("tbody");
          L.forEach(x=>{
            const r=E("tr");
            const z=x.zirve_ayri
              ? ((x.zirve>0?"+":"")+x.zirve.toFixed(1).replace(".",",")+"% @"+x.zirve_saat)
              : "zirve = şimdi";
            r.appendChild(E("td","mc",x.mac));
            r.appendChild(E("td","num",x.kickoff));
            r.appendChild(E("td",null,x.secim));
            r.appendChild(E("td","num",x.acilis+" → "+x.simdi));
            r.appendChild(E("td","num "+cls,pf(x.degisim)));
            r.appendChild(E("td","num",z));
            r.appendChild(E("td",null,x.sinif));
            r.appendChild(E("td",null,x.durum));
            b2.appendChild(r);
          });
          t2.appendChild(b2);s2.appendChild(t2);c.appendChild(s2);
        });
      }
      const h=d.hareket_yorum;
      const n=E("div","net");
      [["Ölenler",h.olenler,false],
       ["Yarı yolda dönenler",h.yari_yolda_donenler,false],
       ["Günün en iyi hareketi",h.gunun_en_iyisi,true],
       ["İkincisi",h.ikincisi,true],
       ["Üçüncüsü",h.ucuncusu,true]].filter(x=>x[1])
      .forEach(([b,p,v])=>{const s=E("div","net-sat"+(v?" vurgu":""));
        s.appendChild(E("b",null,b));s.appendChild(E("p",null,p));n.appendChild(s);});
      c.appendChild(n);
    }
  });

  /* --- DG %100 --- */
  baslik(c,"DataGaffer %100");
  const sar=E("div","tablo-sar"),t=E("table");t.style.minWidth="360px";
  const th=E("thead"),tr=E("tr");
  ["Takım","Seçim","%","Örneklem","Ligimizde"].forEach(x=>tr.appendChild(E("th",null,x)));
  th.appendChild(tr);t.appendChild(th);
  const tb=E("tbody");
  d.datagaffer_100.kayitlar.forEach(k=>{
    const r=E("tr");
    /* 🔴 Alan adlari SOZLESMEYE bagli: takim/secim/yuzde(SAYI)/orneklem/bizim_ligimizde(bool).
       8 Eyl 2026'da tur `market/count/ligimizde` yazdi -> sutunlar BOS, yuzde "100%%" cikti.
       Artik scripts/rapor_sema.py render'dan once reddediyor; asagidaki `??` yalnizca
       eski arsiv dosyalarini acabilmek icin. */
    r.appendChild(E("td","mc"+(k.bizim_ligimizde?" bizim":""),k.takim));
    r.appendChild(E("td",null,k.secim ?? k.market));
    r.appendChild(E("td","num",(typeof k.yuzde==="number"? k.yuzde+"%" : String(k.yuzde??"—"))));
    r.appendChild(E("td","num",k.orneklem ?? k.count));
    r.appendChild(E("td",k.bizim_ligimizde?"bizim":null,k.bizim_ligimizde?"evet":"—"));
    tb.appendChild(r);
  });
  t.appendChild(tb);sar.appendChild(t);c.appendChild(sar);

  /* --- karne --- */
  baslik(c,"Karne");
  const kn=E("div","karne");
  d.karne.satirlar.forEach(s=>{
    const r=E("div","karne-sat");
    r.appendChild(E("div","karne-ad",s.ad));
    const sg=E("div","karne-sag");
    sg.appendChild(E("span","isabet",s.isabet===null?"—":"%"+s.isabet.toFixed(0)));
    r.appendChild(sg);
    const bar=E("div","karne-bar"),i=E("i");
    i.style.width=(s.isabet===null?0:s.isabet)+"%";
    if(s.isabet!==null&&s.isabet>=50)i.className="iyi";
    bar.appendChild(i);r.appendChild(bar);
    r.appendChild(E("div","karne-alt",
      s.kapanan+" kapanan · "+s.tuttu+" tuttu · "+s.acik+" açık"));
    if(s.siniflar){
      const parca=Object.keys(s.siniflar).map(sn=>sn+" "+s.siniflar[sn].tuttu+"/"+s.siniflar[sn].kapanan);
      r.appendChild(E("div","karne-alt siniflar",parca.join("  ·  ")));
    }
    kn.appendChild(r);
  });
  c.appendChild(kn);

}

(async()=>{
  let d;
  try{
    d = KAYNAK ? await (await fetch(KAYNAK)).json()
               : JSON.parse(document.getElementById("rapor-data").textContent);
    ciz(d);
  }catch(e){
    document.getElementById("icerik").appendChild(
      E("div","uyari-sat","Rapor yüklenemedi: "+e.message));
  }
})();
</script>

</body>
</html>
